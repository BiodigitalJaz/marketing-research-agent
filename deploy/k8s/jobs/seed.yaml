# Headless bootstrap, an alternative to first-run setup in the UI: admin
# user, workspace, lanes, routes, prompts, starter sources. Idempotent. Uses
# the image's baked config; DB URL and secrets come from research-agent-env.
# Add args such as ["-brand-example", "benchwright"] to import a brand pack.
# Not part of the kustomization; run with `make seed-cluster`, or:
#   kubectl -n research-agent create secret generic research-agent-admin \
#     --from-literal=RESEARCH_AGENT_ADMIN_EMAIL=... --from-literal=RESEARCH_AGENT_ADMIN_PASSWORD=...
#   kubectl -n research-agent delete job seed --ignore-not-found
#   kubectl -n research-agent apply -f deploy/k8s/jobs/seed.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: research-agent
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: ghcr.io/biodigitaljaz/marketing-research-agent-migrate:main
          command: ["/usr/local/bin/seed"]
          envFrom:
            - secretRef: { name: research-agent-env }
            - secretRef: { name: research-agent-admin }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
