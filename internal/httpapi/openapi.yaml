        default: { $ref: "#/components/responses/Error" }

  /knowledge/memory-bank:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getMemoryBank
      description: The memory bank's core files (generated from the internal docs), in dependency order.
