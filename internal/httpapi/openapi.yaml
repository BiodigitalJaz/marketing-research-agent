openapi: 3.1.0
info:
  title: Marketing Research Agent API
  version: 0.8.0
  description: |
    Hand-written for the MVP; the web client is generated from this file
    (`make api-client`). Keep it in sync with internal/httpapi handlers.

    Auth: cookie session from POST /auth/login. Every state-changing request
    except login must send the `X-CSRF-Token` header (value from the login or
    /auth/me response). Workspace-scoped routes use `X-Workspace-ID`
    (defaults to the user's first workspace). Errors use the Error schema.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness
      security: []
      responses:
        "200": { description: Process is up, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /ready:
    get:
      operationId: getReady
      summary: Readiness (database reachable)
      security: []
      responses:
        "200": { description: Ready to serve, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        "503": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: Signed in; sets session and CSRF cookies, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      operationId: me
      responses:
        "200": { description: Current session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      operationId: changePassword
      description: Changes the signed-in user's password and signs them out of every other session.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12 }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /settings/users:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMembers
      responses:
        "200": { description: Workspace members, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addMember
      description: >-
        Adds a person to the workspace. A new email creates the account with the given temporary password (the app sends no email;
        share it yourself). Someone who already has an account in another workspace keeps their own password (kept_password).
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                password: { type: string, description: Temporary password (at least 12 characters) for a new account }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                type: object
                required: [member, kept_password]
                properties:
                  member: { $ref: "#/components/schemas/Member" }
                  kept_password: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /settings/users/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    put:
      operationId: updateMember
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
                name: { type: string }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      description: Removes the person from this workspace (their account stays for attribution). Refused for the last admin.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }
  /settings/users/{id}/password:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: resetMemberPassword
      description: Sets a temporary password and signs the person out. Refused for people who also belong to other workspaces.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, minLength: 12 } } } } }
      responses:
        "204": { description: Reset }
        default: { $ref: "#/components/responses/Error" }
  /settings/workspace/name:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    put:
      operationId: renameWorkspace
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        "200": { description: Renamed, content: { application/json: { schema: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /setup/status:
    get:
      operationId: setupStatus
      security: []
      description: Whether this install still needs first-run setup (no users exist yet).
      responses:
        "200": { description: Setup status, content: { application/json: { schema: { $ref: "#/components/schemas/SetupStatus" } } } }
  /setup:
    post:
      operationId: setup
      security: []
      description: >-
        Claims a fresh install: creates the admin user, the workspace, and its defaults, then signs the admin in.
        Works only while no user exists, with the one-time setup token from the api log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, workspace]
              properties:
                token: { type: string }
                email: { type: string }
                name: { type: string }
                password: { type: string, minLength: 12 }
                workspace: { type: string, description: Workspace (brand) name }
                example_brand: { type: string, description: Import this embedded example brand pack }
      responses:
        "200": { description: Set up and signed in; sets session and CSRF cookies, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /setup/checklist:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: setupChecklist
      description: The "Getting started" steps and whether each is done.
      responses:
        "200": { description: Checklist, content: { application/json: { schema: { $ref: "#/components/schemas/SetupChecklist" } } } }
        default: { $ref: "#/components/responses/Error" }

  /brand/profile:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getBrandProfile
      responses:
        "200": { description: Brand profile, content: { application/json: { schema: { $ref: "#/components/schemas/BrandProfileResponse" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putBrandProfile
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BrandProfile" } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/BrandProfileResponse" } } } }
        default: { $ref: "#/components/responses/Error" }

  /brand/import:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: importBrandPack
      description: >-
        Applies a brand pack (YAML or JSON text). merge fills empty profile fields and adds keywords, competitors, ICPs, and
        portfolio items that aren't there yet; replace swaps the whole brand for the pack's. dry_run reports the changes without writing.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack]
              properties:
                pack: { type: string, description: The brand pack as YAML or JSON }
                mode: { type: string, enum: [merge, replace], default: merge }
                dry_run: { type: boolean }
                rename_workspace: { type: boolean, description: "Also rename the workspace to the pack's name (admins); prompts use it as the brand name" }
      responses:
        "200":
          description: Applied (or previewed)
          content:
            application/json:
              schema:
                type: object
                required: [name, dry_run, renamed, summary]
                properties:
                  name: { type: string }
                  dry_run: { type: boolean }
                  renamed: { type: boolean }
                  summary:
                    type: object
                    required: [mode, profile_fields, keywords, competitors, icps, portfolio]
                    properties:
                      mode: { type: string }
                      profile_fields: { type: integer }
                      keywords: { type: integer }
                      competitors: { type: integer }
                      icps: { type: integer }
                      portfolio: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /brand/export:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: exportBrandPack
      description: The workspace's brand as a YAML brand pack (download).
      responses:
        "200": { description: Brand pack, content: { application/yaml: { schema: { type: string } } } }
        default: { $ref: "#/components/responses/Error" }
  /portfolio:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listPortfolio
      responses:
        "200": { description: Items, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PortfolioItem" } } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPortfolioItem
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioInput" } } } }
      responses:
        "201": { description: Created; embedding is computed in the background, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioItem" } } } }
        default: { $ref: "#/components/responses/Error" }
  /portfolio/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    get:
      operationId: getPortfolioItem
      responses:
        "200": { description: Item, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioItem" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updatePortfolioItem
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioInput" } } } }
      responses:
        "200": { description: Updated; re-embedded in the background, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioItem" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePortfolioItem
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /icps:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listICPs
      responses:
        "200": { description: ICPs, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ICP" } } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createICP
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ICPInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ICP" } } } }
        default: { $ref: "#/components/responses/Error" }
  /icps/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    put:
      operationId: updateICP
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ICPInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/ICP" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteICP
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /keywords:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listKeywords
      responses:
        "200": { description: Keywords, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Keyword" } } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createKeyword
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KeywordInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Keyword" } } } }
        default: { $ref: "#/components/responses/Error" }
  /keywords/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    put:
      operationId: updateKeyword
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KeywordInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Keyword" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteKeyword
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /competitors:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listCompetitors
      responses:
        "200": { description: Competitors, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Competitor" } } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCompetitor
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CompetitorInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Competitor" } } } }
        default: { $ref: "#/components/responses/Error" }
  /competitors/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    put:
      operationId: updateCompetitor
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CompetitorInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Competitor" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCompetitor
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /sources:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listSources
      responses:
        "200": { description: Sources with health, content: { application/json: { schema: { type: object, required: [items, connectors], properties: { items: { type: array, items: { $ref: "#/components/schemas/Source" } }, connectors: { $ref: "#/components/schemas/StringList" } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSource
      summary: Add a source (admin)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SourceInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } } }
        default: { $ref: "#/components/responses/Error" }
  /sources/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    put:
      operationId: updateSource
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SourceInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSource
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /sources/{id}/test:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: testSource
      summary: Fetch once and return sample items; nothing is saved
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Sample, content: { application/json: { schema: { type: object, required: [ok, items], properties: { ok: { type: boolean }, error: { type: string }, items: { type: array, items: { $ref: "#/components/schemas/ItemPreview" } } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /monitors:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMonitors
      responses:
        "200": { description: Monitors, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Monitor" } } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMonitor
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MonitorInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Monitor" } } } }
        default: { $ref: "#/components/responses/Error" }
  /monitors/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    put:
      operationId: updateMonitor
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MonitorInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Monitor" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMonitor
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /monitors/{id}/run:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: runMonitor
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "202": { description: Collection enqueued, content: { application/json: { schema: { type: object, properties: { job_id: { type: integer } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /monitors/{id}/progress:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    get:
      operationId: monitorProgress
      description: The current or latest run. Phases in order are queued, collecting (sources_done of sources_total), scoring (processed of collected), and done; idle before the first run.
      responses:
        "200": { description: Progress, content: { application/json: { schema: { $ref: "#/components/schemas/MonitorProgress" } } } }
        default: { $ref: "#/components/responses/Error" }

  /items:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listItems
      summary: Recently collected items
      parameters:
        - { name: source_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: monitor_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: Items, content: { application/json: { schema: { type: object, required: [items, total], properties: { items: { type: array, items: { $ref: "#/components/schemas/RawItem" } }, total: { type: integer } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /items/process:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: processItems
      summary: Enqueue scoring for unprocessed items (rescore=true also re-runs recent items that produced nothing)
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: rescore, in: query, required: false, schema: { type: boolean } }
      responses:
        "202": { description: Enqueued, content: { application/json: { schema: { type: object, required: [enqueued], properties: { enqueued: { type: integer } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /opportunities:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listOpportunities
      parameters:
        - { name: lane, in: query, required: false, schema: { $ref: "#/components/schemas/Lane" } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [new, saved, acted, dismissed, snoozed, expired, all] } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: min_score, in: query, required: false, schema: { type: number } }
        - { name: featured, in: query, required: false, schema: { type: boolean } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Featured first, then by score
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, counts]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Opportunity" } }
                  next_cursor: { type: [string, "null"] }
                  counts: { type: object, additionalProperties: { type: object, required: [new, featured], properties: { new: { type: integer }, featured: { type: integer } } } }
        default: { $ref: "#/components/responses/Error" }
  /opportunities/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    get:
      operationId: getOpportunity
      responses:
        "200": { description: Detail, content: { application/json: { schema: { $ref: "#/components/schemas/OpportunityDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /opportunities/{id}/status:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: setOpportunityStatus
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, saved, acted, dismissed, snoozed] }
                reason: { type: string, enum: [off_topic, low_intent, wrong_fit, too_old, duplicate, bad_source, other], description: Required when dismissing }
                note: { type: string }
                snoozed_until: { type: string, format: date-time }
      responses:
        "204": { description: Updated }
        default: { $ref: "#/components/responses/Error" }
  /opportunities/{id}/events:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: logOpportunityEvent
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: string, enum: [viewed, opened_link, copied_draft, outcome] }
                outcome: { type: string, enum: [no_response, reply, dm, meeting, lead, client] }
                meta: { type: object, additionalProperties: true, description: "copied_draft requires meta.draft_id (a draft of this opportunity)" }
      responses:
        "204": { description: Logged }
        default: { $ref: "#/components/responses/Error" }
  /opportunities/{id}/drafts:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: requestDrafts
      description: Queues draft generation. Poll GET /opportunities/{id} (drafting.state) for the result. Drafts are suggestions; nothing is ever posted.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [reply, pitch, comment], description: Defaults to the lane's draft kind }
                instruction: { type: string, maxLength: 1000, description: Regenerate with this instruction }
      responses:
        "202":
          description: Queued (queued=false when an identical request is already pending)
          content: { application/json: { schema: { type: object, required: [queued], properties: { queued: { type: boolean } } } } }
        default: { $ref: "#/components/responses/Error" }

  /research:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listResearch
      parameters: [{ name: archived, in: query, schema: { type: boolean }, description: List archived jobs instead of active ones }]
      responses:
        "200":
          description: Recent jobs
          content: { application/json: { schema: { type: object, required: [items, templates], properties: { items: { type: array, items: { $ref: "#/components/schemas/ResearchJob" } }, templates: { type: array, items: { type: string } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createResearch
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, question]
              properties:
                mode: { type: string, enum: [chat, deep] }
                question: { type: string, maxLength: 4000 }
                template: { type: [string, "null"], enum: [freeform, competitor_teardown, market_scan, pain_points, topic_deep_dive, null] }
                use_web: { type: boolean, description: "false = collected corpus and brand data only (default true)" }
      responses:
        "201": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchJob" } } } }
        default: { $ref: "#/components/responses/Error" }
  /research/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    get:
      operationId: getResearch
      responses:
        "200":
          description: Job with its steps and chat messages
          content:
            application/json:
              schema:
                type: object
                required: [job, steps, messages]
                properties:
                  job: { $ref: "#/components/schemas/ResearchJob" }
                  steps: { type: array, items: { $ref: "#/components/schemas/ResearchStep" } }
                  messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteResearch
      description: Deletes a finished research job with its steps and chat. Reports it produced are kept. The author or an admin; running jobs must be cancelled first (409).
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /research/{id}/stream:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: streamResearch
      description: "Server-sent events: `step` events (id = seq, data = ResearchStep); the stream ends after the `done` step. Resume with Last-Event-ID or ?after=. EventSource clients pass ?workspace= instead of the header."
      parameters:
        - { name: workspace, in: query, schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: integer } }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
        default: { $ref: "#/components/responses/Error" }
  /research/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: researchFollowUp
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 4000 } } } } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchJob" } } } }
        default: { $ref: "#/components/responses/Error" }
  /research/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: cancelResearch
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchJob" } } } }
        default: { $ref: "#/components/responses/Error" }
  /research/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
    post:
      operationId: archiveResearch
      description: Hides a research job from the list (archived true) or restores it. Archived jobs stay readable.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [archived], properties: { archived: { type: boolean } } } } } }
      responses:
        "204": { description: Updated }
        default: { $ref: "#/components/responses/Error" }
  /reports:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listReports
      responses:
        "200":
          description: Reports, newest first
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ReportSummary" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /reports/{id}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ID" }]
