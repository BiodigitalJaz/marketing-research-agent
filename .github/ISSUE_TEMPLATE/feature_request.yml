name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What are you trying to do, and what gets in the way?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help }
  - type: markdown
    attributes:
      value: "Note: the project never posts, comments, or messages on external platforms. Requests for automated posting will be declined."
